[package]
name = "iphoneloadly-api"
version = "0.3.0-alpha.3"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1.89"
aes-gcm = "0.10.3"
axum = { version = "0.8.8", features = ["multipart"] }
base64 = "0.22.1"
idevice = { version = "=0.1.65", features = ["tcp", "usbmuxd", "remote_pairing", "mdns", "rsd", "afc", "installation_proxy", "core_device", "core_device_proxy", "tunnel_tcp_stack"] }
# Pin the same signing stack as iLoader at the verified surgical GSA-503 backport.
isideload = { version = "0.3.17", git = "https://github.com/lemehavit/isideload", package = "isideload", rev = "76e0749ded7e9bd4ae7dd3748ea99c43f240f0da", features = ["fs-storage"] }
if-addrs = "0.15.0"
mdns-sd = "0.20.3"
plist = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rusqlite = { version = "0.38.0", features = ["bundled"] }
rand = "0.9.2"
rustls = { version = "0.23.36", features = ["aws_lc_rs"] }
sha2 = "0.10.9"
time = { version = "0.3.55", features = ["formatting"] }
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "sync", "time"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "stream", "rustls-tls"] }
reqwest-013 = { package = "reqwest", version = "=0.13.4", default-features = false }
semver = "1.0.27"
rootcause = "=0.12.1"
futures-util = "0.3.31"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
zip = { version = "7.0.0", default-features = false, features = ["deflate"] }
