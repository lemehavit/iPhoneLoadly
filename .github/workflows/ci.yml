name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config \
            libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - run: find deploy/host deploy/release scripts -type f -name '*.sh' -exec bash -n {} +
      - run: bash deploy/release/build-release.sh
      - run: bash deploy/release/verify-release-package.sh
      - name: Verify shipped systemd units
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends systemd
          getent group iphoneloadly-mux >/dev/null || sudo groupadd --system iphoneloadly-mux
          sudo mkdir -p /opt/iphoneloadly/bin /usr/local/libexec/iphoneloadly /var/lib/lockdown
          sudo install -m 0755 /usr/bin/true /opt/iphoneloadly/bin/iphoneloadly-api
          sudo install -m 0755 /usr/bin/true /usr/local/libexec/iphoneloadly/netmuxd
          sudo install -m 0755 /usr/bin/true /usr/local/libexec/iphoneloadly/publish-dashboard-mdns.sh
          sudo install -m 0755 /usr/bin/true /usr/local/libexec/iphoneloadly/update-iphoneloadly.sh
          systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.path deploy/systemd/*.timer
      - name: Validate Debian 13 upgrade preservation
        run: |
          release_version="$(tr -d '[:space:]' < VERSION)"
          release_archive="dist/iphoneloadly-v${release_version}-linux-amd64.tar.gz"
          release_checksum="${release_archive}.sha256"
          set -Eeuo pipefail
          trap 'status=$?; echo "::error::Debian validation failed at line ${LINENO}: ${BASH_COMMAND}"; exit "${status}"' ERR
          echo "::group::Verify release checksum"
          (cd dist && sha256sum -c "$(basename "${release_checksum}")")
          echo "::endgroup::"
          echo "::group::Run Debian 13 preservation validation"
          container_log="${RUNNER_TEMP}/iphoneloadly-debian-validation.log"
          docker run --rm --interactive --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}/dist:/release:ro" \
            debian:13-slim bash -s -- "${release_archive##*/}" "${release_version}" <<'CONTAINER_SCRIPT' \
            | tee "${container_log}"
          set -Eeuo pipefail
          container_error() {
            status=$?
            echo "::error::Debian container failed at line ${BASH_LINENO[0]}: ${BASH_COMMAND}"
            if [[ -f /tmp/systemctl-invocations.log ]]; then
              echo "::group::systemctl log"
              cat /tmp/systemctl-invocations.log
              echo "::endgroup::"
            fi
            if [[ -f /tmp/api.log ]]; then
              echo "::group::API log"
              cat /tmp/api.log
              echo "::endgroup::"
            fi
            exit "${status}"
          }
          trap container_error ERR
          release_archive="/release/$1"
          expected_version="$2"
          echo "::group::Install Debian fixture dependencies"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates \
            curl \
            libdbus-1-3 \
            procps \
            sqlite3 \
            sudo
          echo "::endgroup::"
          echo "::group::Extract release archive"
          mkdir -p /tmp/package
          tar -xzf "${release_archive}" -C /tmp/package --strip-components=1
          test -x /tmp/package/bin/iphoneloadly-api
          test -x /tmp/package/install-iphoneloadly.sh
          stat --format='%a %n' \
            /tmp/package/bin/iphoneloadly-api \
            /tmp/package/install-iphoneloadly.sh
          echo "::endgroup::"
          echo "::group::Seed preservation fixtures"
          mkdir -p /etc/iphoneloadly /etc/caddy \
            /var/lib/iphoneloadly/data/apps \
            /var/lib/iphoneloadly/data/signing \
            /var/lib/lockdown
          install -d -o root -g root -m 0755 /usr/local/libexec/iphoneloadly
          printf '%s\n' \
            'RUST_LOG=warn' \
            'IPHONELOADLY_ANISETTE_URL=http://127.0.0.1:6970' \
            'IPHONELOADLY_MUX_SOCKET=/run/iphoneloadly/mux.sock' \
            'IPHONELOADLY_PAIRING_DIR=/var/lib/lockdown' \
            >/etc/iphoneloadly/api.env
          sqlite3 /var/lib/iphoneloadly/data/fixture.sqlite3 <<'SQL'
          CREATE TABLE marker (value TEXT NOT NULL);
          INSERT INTO marker (value) VALUES ('alpha2-database-fixture');
          SQL
          printf '%s\n' 'alpha2-uploaded-ipa-fixture' \
            >/var/lib/iphoneloadly/data/apps/fixture.ipa
          printf '%s\n' 'alpha2-signing-state-fixture' \
            >/var/lib/iphoneloadly/data/signing/fixture.state
          printf '%s\n' 'alpha2-pairing-fixture' \
            >/var/lib/lockdown/fixture.plist
          printf '%s\n' 'alpha2-caddy-fixture' \
            >/etc/caddy/Caddyfile
          chmod 0600 /etc/iphoneloadly/api.env
          chmod 0640 /var/lib/iphoneloadly/data/fixture.sqlite3
          chmod 0640 /var/lib/iphoneloadly/data/apps/fixture.ipa
          chmod 0600 /var/lib/iphoneloadly/data/signing/fixture.state
          chmod 0600 /var/lib/lockdown/fixture.plist
          chmod 0644 /etc/caddy/Caddyfile
          echo "::endgroup::"
          preserved_files=(
            /etc/iphoneloadly/api.env
            /var/lib/iphoneloadly/data/fixture.sqlite3
            /var/lib/iphoneloadly/data/apps/fixture.ipa
            /var/lib/iphoneloadly/data/signing/fixture.state
            /var/lib/lockdown/fixture.plist
            /etc/caddy/Caddyfile
          )
          echo "::group::Record pre-upgrade preservation state"
          : >/tmp/pre-hashes
          : >/tmp/pre-metadata
          for path in "${preserved_files[@]}"; do
            sha256sum "${path}" >>/tmp/pre-hashes
            stat --format='%a %U:%G %n' "${path}" >>/tmp/pre-metadata
          done
          cat /tmp/pre-hashes
          cat /tmp/pre-metadata
          echo "::endgroup::"
          echo "::group::Install lifecycle-aware systemctl test double"
          cat >/usr/local/bin/systemctl <<'SYSTEMCTL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          invocations=/tmp/systemctl-invocations.log
          active_file=/tmp/api-service-active
          api_pid_file=/tmp/api.pid
          api_log=/tmp/api.log
          printf '%s\n' "$*" >>"${invocations}"
          start_api() {
            set -a
            # shellcheck disable=SC1091
            source /etc/iphoneloadly/api.env
            set +a
            cd /var/lib/iphoneloadly
            nohup /opt/iphoneloadly/bin/iphoneloadly-api \
              >>"${api_log}" 2>&1 </dev/null &
            api_pid=$!
            printf '%s\n' "${api_pid}" >"${api_pid_file}"
            : >"${active_file}"
          }
          case "$*" in
            "daemon-reload")
              exit 0
              ;;
            "enable --now iphoneloadly-update.path iphoneloadly-source-sync.timer")
              exit 0
              ;;
            "is-enabled --quiet iphoneloadly-update.path")
              [[ -f /tmp/update-path-enabled ]]
              ;;
            "is-enabled --quiet iphoneloadly-source-sync.timer")
              [[ -f /tmp/source-sync-timer-enabled ]]
              ;;
            "enable --now iphoneloadly-update.path")
              : >/tmp/update-path-enabled
              exit 0
              ;;
            "enable --now iphoneloadly-source-sync.timer")
              : >/tmp/source-sync-timer-enabled
              exit 0
              ;;
            "disable --now iphoneloadly-update.path")
              rm -f /tmp/update-path-enabled
              exit 0
              ;;
            "disable --now iphoneloadly-source-sync.timer")
              rm -f /tmp/source-sync-timer-enabled
              exit 0
              ;;
            "stop iphoneloadly-api.service")
              if [[ -f "${api_pid_file}" ]]; then
                api_pid="$(cat "${api_pid_file}")"
                if kill -0 "${api_pid}" 2>/dev/null; then
                  kill "${api_pid}" 2>/dev/null || true
                  for _ in $(seq 1 20); do
                    kill -0 "${api_pid}" 2>/dev/null || break
                    sleep 1
                  done
                fi
              fi
              rm -f -- "${active_file}"
              ;;
            "is-active --quiet iphoneloadly-api.service")
              [[ -f "${active_file}" ]]
              ;;
            "start iphoneloadly-api.service")
              (
                sleep 2
                start_api
              ) >/dev/null 2>&1 </dev/null &
              printf '%s\n' started >/tmp/api-start-returned
              exit 0
              ;;
            *)
              echo "Unexpected systemctl invocation: $*" >&2
              exit 64
              ;;
          esac
          SYSTEMCTL
          chmod 0755 /usr/local/bin/systemctl
          test "$(sudo sh -c 'command -v systemctl')" = /usr/local/bin/systemctl
          echo "::endgroup::"
          mkdir -p /opt/iphoneloadly/bin
          echo "::group::Seed running old API and replacement guard"
          install -m 0755 /usr/bin/sleep /opt/iphoneloadly/bin/iphoneloadly-api
          nohup /opt/iphoneloadly/bin/iphoneloadly-api 300 \
            >/tmp/old-api.log 2>&1 </dev/null &
          old_api_pid=$!
          printf '%s\n' "${old_api_pid}" >/tmp/api.pid
          : >/tmp/api-service-active
          mkdir -p /tmp/fake-bin
          cat >/tmp/fake-bin/sudo <<'SUDO'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "mv" ]]; then
            api_pid="$(cat /tmp/api.pid 2>/dev/null || true)"
            if [[ -n "${api_pid}" ]] && kill -0 "${api_pid}" 2>/dev/null; then
              printf '%s\n' true >/tmp/replacement-while-active
            else
              printf '%s\n' false >/tmp/replacement-while-active
            fi
          fi
          exec /usr/bin/sudo "$@"
          SUDO
          chmod 0755 /tmp/fake-bin/sudo
          test "$(kill -0 "${old_api_pid}" 2>/dev/null && echo active)" = active
          echo "old_api_pid=${old_api_pid}"
          echo "::endgroup::"
          echo "::group::Run packaged upgrade installer"
          PATH="/tmp/fake-bin:${PATH}" \
            bash /tmp/package/install-iphoneloadly.sh \
              --upgrade \
              --binary /tmp/package/bin/iphoneloadly-api \
              --package-root /tmp/package
          echo "Installer exited 0; its internal exact-version retry check passed."
          echo "::endgroup::"
          echo "::group::Verify stop-before-replace and delayed readiness"
          test "$(cat /tmp/replacement-while-active)" = false
          test -e /tmp/api-start-returned
          api_pid="$(cat /tmp/api.pid)"
          test -n "${api_pid}"
          for _ in $(seq 1 10); do
            kill -0 "${api_pid}" 2>/dev/null && break
            sleep 1
          done
          kill -0 "${api_pid}"
          test "$(readlink -f "/proc/${api_pid}/exe")" = /opt/iphoneloadly/bin/iphoneloadly-api
          echo "replacement_while_active=false"
          echo "delayed_readiness=passed"
          echo "::endgroup::"
          echo "::group::Verify expected systemctl calls and installed files"
          cat >/tmp/expected-systemctl <<'EXPECTED_SYSTEMCTL'
          stop iphoneloadly-api.service
          is-active --quiet iphoneloadly-api.service
          daemon-reload
          enable --now iphoneloadly-update.path iphoneloadly-source-sync.timer
          start iphoneloadly-api.service
          EXPECTED_SYSTEMCTL
          diff --unified=0 /tmp/expected-systemctl /tmp/systemctl-invocations.log
          test -x /opt/iphoneloadly/bin/iphoneloadly-api
          test -x /usr/local/libexec/iphoneloadly/update-iphoneloadly.sh
          for unit in \
            iphoneloadly-api.service \
            iphoneloadly-update.service \
            iphoneloadly-update.path \
            iphoneloadly-source-sync.service \
            iphoneloadly-source-sync.timer; do
            test -f "/etc/systemd/system/${unit}"
          done
          echo "::endgroup::"
          echo "::group::Verify installer exact target version"
          curl --fail --silent http://127.0.0.1:8080/healthz | tee /tmp/post-healthz.json
          grep -Fq "\"version\":\"${expected_version}\"" /tmp/post-healthz.json
          echo "::endgroup::"
          echo "::group::Verify missing and wrong target versions fail"
          missing_package=/tmp/package-missing-version
          wrong_package=/tmp/package-wrong-version
          cp -a /tmp/package "${missing_package}"
          cp -a /tmp/package "${wrong_package}"
          rm -f "${missing_package}/VERSION"
          if bash "${missing_package}/install-iphoneloadly.sh" \
            --upgrade \
            --binary "${missing_package}/bin/iphoneloadly-api" \
            --package-root "${missing_package}"; then
            echo "Installer accepted a package without VERSION." >&2
            exit 1
          fi
          printf '%s\n' wrong-target-version >"${wrong_package}/VERSION"
          mkdir -p /tmp/fake-bin-wrong
          cat >/tmp/fake-bin-wrong/curl <<'WRONG_CURL'
          #!/usr/bin/env bash
          printf '%s\n' '{"status":"ok","version":"0.3.0-alpha.999"}'
          WRONG_CURL
          chmod 0755 /tmp/fake-bin-wrong/curl
          started_at="$(date +%s)"
          if IPHONELOADLY_STARTUP_TIMEOUT_SECONDS=3 \
            PATH="/tmp/fake-bin-wrong:/tmp/fake-bin:${PATH}" \
            bash "${wrong_package}/install-iphoneloadly.sh" \
              --upgrade \
              --binary "${wrong_package}/bin/iphoneloadly-api" \
              --package-root "${wrong_package}"; then
            echo "Installer accepted a wrong API version." >&2
            exit 1
          fi
          elapsed_seconds=$(( $(date +%s) - started_at ))
          test "${elapsed_seconds}" -lt 10
          /usr/local/bin/systemctl stop iphoneloadly-api.service
          echo "missing_version=failed"
          echo "wrong_version=failed"
          echo "bounded_timeout_seconds=${elapsed_seconds}"
          echo "::endgroup::"
          /usr/local/bin/systemctl start iphoneloadly-api.service
          for _ in $(seq 1 10); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/tmp/restarted-healthz.json; then
              break
            fi
            sleep 1
          done
          grep -Fq "\"version\":\"${expected_version}\"" /tmp/restarted-healthz.json
          prior_health="$(curl --fail --silent http://127.0.0.1:8080/healthz)"
          prior_version="$(printf '%s\n' "${prior_health}" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          test "${prior_version}" = "${expected_version}"
          : >/tmp/update-path-enabled
          rm -f /tmp/source-sync-timer-enabled
          echo "::group::Verify rollback restores runtime after failure"
          rollback_dir=/tmp/rollback-package
          rollback_root=/tmp/rollback-root
          rollback_archive_dir=/tmp/rollback-release
          rollback_archive_name="iphoneloadly-v${expected_version}-linux-amd64.tar.gz"
          mkdir -p "${rollback_dir}" "${rollback_root}" "${rollback_archive_dir}"
          cp -a /tmp/package/. "${rollback_dir}/"
          cat >"${rollback_dir}/install-iphoneloadly.sh" <<'ROLLBACK_INSTALLER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          replacement="$(mktemp /opt/iphoneloadly/bin/.rollback-failure.XXXXXX)"
          : >/tmp/update-path-enabled
          : >/tmp/source-sync-timer-enabled
          if [[ -e /tmp/api-service-active ]] && kill -0 "$(cat /tmp/api.pid)" 2>/dev/null; then
            printf '%s\n' true >/tmp/rollback-replace-while-active
          else
            printf '%s\n' false >/tmp/rollback-replace-while-active
          fi
          rm -f -- "${replacement}"
          cp -a -- /usr/bin/false "${replacement}"
          mv -f -- "${replacement}" /opt/iphoneloadly/bin/iphoneloadly-api
          exit 1
          ROLLBACK_INSTALLER
          chmod 0755 "${rollback_dir}/install-iphoneloadly.sh"
          mkdir -p "${rollback_root}/iphoneloadly-v${expected_version}-linux-amd64"
          cp -a "${rollback_dir}/." \
            "${rollback_root}/iphoneloadly-v${expected_version}-linux-amd64/"
          tar -czf "${rollback_archive_dir}/${rollback_archive_name}" \
            -C "${rollback_root}" "iphoneloadly-v${expected_version}-linux-amd64"
          (
            cd "${rollback_archive_dir}"
            sha256sum "${rollback_archive_name}" >"${rollback_archive_name}.sha256"
          )
          rollback_digest="$(sha256sum "${rollback_archive_dir}/${rollback_archive_name}" | cut -d' ' -f1)"
          runtime_before="$(sha256sum /opt/iphoneloadly/bin/iphoneloadly-api | cut -d' ' -f1)"
          cat >/tmp/fake-bin/curl <<'UPDATER_CURL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          for argument in "$@"; do
            if [[ "${argument}" == *"/healthz" ]]; then
              exec /usr/bin/curl "$@"
            fi
          done
          output=""
          url=""
          while (($#)); do
            case "$1" in
              --output) output="$2"; shift 2 ;;
              http://*|https://*) url="$1"; shift ;;
              *) shift ;;
            esac
          done
          [[ -n "${output}" && -n "${url}" ]]
          if [[ "${url}" == *.sha256 ]]; then
            cp "${rollback_archive_dir}/${rollback_archive_name}.sha256" "${output}"
          else
            cp "${rollback_archive_dir}/${rollback_archive_name}" "${output}"
          fi
          UPDATER_CURL
          chmod 0755 /tmp/fake-bin/curl
          mkdir -p /run/iphoneloadly
          printf '{"targetVersion":"%s","expectedArchiveSha256":"%s","createdAt":"2026-08-28T00:00:00Z"}\n' \
            "${expected_version}" "${rollback_digest}" \
            >/run/iphoneloadly/update-request.json
          chmod 0600 /run/iphoneloadly/update-request.json
          if PATH="/tmp/fake-bin:${PATH}" \
            bash /tmp/package/deploy/host/update-iphoneloadly.sh; then
            updater_status=0
          else
            updater_status=$?
          fi
          test "${updater_status}" -ne 0
          test ! -e /run/iphoneloadly/update-request.json
          grep -Fq '"status":"failed"' /var/lib/iphoneloadly/data/update-status.json
          runtime_after="$(sha256sum /opt/iphoneloadly/bin/iphoneloadly-api | cut -d' ' -f1)"
          test "${runtime_after}" = "${runtime_before}"
          curl --fail --silent http://127.0.0.1:8080/healthz | \
            grep -Fq "\"version\":\"${prior_version}\""
          test "$(sed -n '1p' /tmp/rollback-replace-while-active)" = true
          test -e /tmp/update-path-enabled
          test ! -e /tmp/source-sync-timer-enabled
          echo "rollback_runtime_restored=true"
          echo "rollback_status_preserved=failed"
          echo "::endgroup::"
          echo "::group::Verify preservation state"
          : >/tmp/post-hashes
          : >/tmp/post-metadata
          for path in "${preserved_files[@]}"; do
            sha256sum "${path}" >>/tmp/post-hashes
            stat --format='%a %U:%G %n' "${path}" >>/tmp/post-metadata
          done
          diff --unified=0 /tmp/pre-hashes /tmp/post-hashes
          diff --unified=0 /tmp/pre-metadata /tmp/post-metadata
          echo "Preservation hashes and metadata are unchanged."
          echo "::endgroup::"
          echo "debian-preservation-validation-complete"
          echo "::endgroup::"
          CONTAINER_SCRIPT
          if ! grep -Fq 'debian-preservation-validation-complete' "${container_log}"; then
            echo "Debian container completion marker was not observed." >&2
            cat "${container_log}"
            exit 1
          fi
      - name: Upload verified Linux package
        uses: actions/upload-artifact@v4
        with:
          name: iphoneloadly-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
