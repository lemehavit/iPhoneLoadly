name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config \
            libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - run: find deploy/host deploy/release scripts -type f -name '*.sh' -exec bash -n {} +
      - run: bash deploy/release/build-release.sh
      - run: bash deploy/release/verify-release-package.sh
      - name: Verify shipped systemd units
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends systemd
          getent group iphoneloadly-mux >/dev/null || sudo groupadd --system iphoneloadly-mux
          sudo mkdir -p /opt/iphoneloadly/bin /usr/local/libexec/iphoneloadly /var/lib/lockdown
          sudo install -m 0755 /usr/bin/true /opt/iphoneloadly/bin/iphoneloadly-api
          sudo install -m 0755 /usr/bin/true /usr/local/libexec/iphoneloadly/netmuxd
          sudo install -m 0755 /usr/bin/true /usr/local/libexec/iphoneloadly/publish-dashboard-mdns.sh
          sudo install -m 0755 /usr/bin/true /usr/local/libexec/iphoneloadly/update-iphoneloadly.sh
          systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.path deploy/systemd/*.timer
      - name: Validate Debian 13 upgrade preservation
        env:
          RELEASE_ARCHIVE: dist/iphoneloadly-v0.2.0-alpha.3-linux-amd64.tar.gz
          RELEASE_CHECKSUM: dist/iphoneloadly-v0.2.0-alpha.3-linux-amd64.tar.gz.sha256
        run: |
          set -Eeuo pipefail
          (cd dist && sha256sum -c "$(basename "${RELEASE_CHECKSUM}")")
          container="iphoneloadly-upgrade-${GITHUB_RUN_ID}"
          container_image="iphoneloadly-upgrade-image-${GITHUB_RUN_ID}"
          cat >"${RUNNER_TEMP}/Dockerfile.iphoneloadly" <<'EOF'
          FROM debian:13-slim
          RUN apt-get update \
              && DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
                   ca-certificates curl sudo systemd systemd-sysv socat sqlite3 \
              && rm -rf /var/lib/apt/lists/*
          STOPSIGNAL SIGRTMIN+3
          CMD ["/lib/systemd/systemd"]
          EOF
          docker build --platform linux/amd64 \
            --tag "${container_image}" \
            --file "${RUNNER_TEMP}/Dockerfile.iphoneloadly" \
            "${RUNNER_TEMP}"
          docker run --platform linux/amd64 --detach --privileged --cgroupns=host \
            --env container=docker \
            --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --volume "${GITHUB_WORKSPACE}/dist:/release:ro" \
            --name "${container}" "${container_image}"
          for attempt in $(seq 1 30); do
            if docker exec "${container}" test -d /run/systemd/system; then
              break
            fi
            [[ "${attempt}" -lt 30 ]] || {
              docker logs "${container}"
              exit 1
            }
            sleep 2
          done
          docker exec "${container}" mkdir -p /tmp/package
          docker exec "${container}" tar -xzf \
            /release/iphoneloadly-v0.2.0-alpha.3-linux-amd64.tar.gz \
            -C /tmp/package --strip-components=1
          docker exec "${container}" chmod 0755 \
            /tmp/package/bin/iphoneloadly-api /tmp/package/install-iphoneloadly.sh
          docker exec "${container}" stat --format='%a %n' \
            /tmp/package/bin/iphoneloadly-api /tmp/package/install-iphoneloadly.sh
          docker exec "${container}" test -x /tmp/package/bin/iphoneloadly-api
          docker exec "${container}" test -x /tmp/package/install-iphoneloadly.sh
          docker exec "${container}" bash -c '
            set -Eeuxo pipefail
            mkdir -p /etc/iphoneloadly /etc/caddy \
              /var/lib/iphoneloadly/data/apps \
              /var/lib/iphoneloadly/data/signing /var/lib/lockdown
            printf "%s\n" "RUST_LOG=warn" \
              "IPHONELOADLY_ANISETTE_URL=http://127.0.0.1:6970" \
              "IPHONELOADLY_MUX_SOCKET=/run/iphoneloadly/mux.sock" \
              "IPHONELOADLY_PAIRING_DIR=/var/lib/lockdown" \
              >/etc/iphoneloadly/api.env
            sqlite3 /var/lib/iphoneloadly/data/fixture.sqlite3 \
              "CREATE TABLE marker (value TEXT NOT NULL); INSERT INTO marker VALUES (\"alpha2-database-fixture\");"
            printf "%s\n" "alpha2-uploaded-ipa-fixture" \
              >/var/lib/iphoneloadly/data/apps/fixture.ipa
            printf "%s\n" "alpha2-signing-state-fixture" \
              >/var/lib/iphoneloadly/data/signing/fixture.state
            printf "%s\n" "alpha2-pairing-fixture" \
              >/var/lib/lockdown/fixture.plist
            printf "%s\n" "alpha2-caddy-fixture" \
              >/etc/caddy/Caddyfile
            chmod 0600 /etc/iphoneloadly/api.env
            chmod 0640 /var/lib/iphoneloadly/data/fixture.sqlite3
            chmod 0640 /var/lib/iphoneloadly/data/apps/fixture.ipa
            chmod 0600 /var/lib/iphoneloadly/data/signing/fixture.state
            chmod 0600 /var/lib/lockdown/fixture.plist
            chmod 0644 /etc/caddy/Caddyfile
          '
          preserved_files=(
            /etc/iphoneloadly/api.env
            /var/lib/iphoneloadly/data/fixture.sqlite3
            /var/lib/iphoneloadly/data/apps/fixture.ipa
            /var/lib/iphoneloadly/data/signing/fixture.state
            /var/lib/lockdown/fixture.plist
            /etc/caddy/Caddyfile
          )
          : >"${RUNNER_TEMP}/iphoneloadly-pre-hashes"
          : >"${RUNNER_TEMP}/iphoneloadly-pre-modes"
          for path in "${preserved_files[@]}"; do
            docker exec "${container}" sha256sum "${path}" \
              >>"${RUNNER_TEMP}/iphoneloadly-pre-hashes"
            docker exec "${container}" stat --format='%a %U:%G %n' "${path}" \
              >>"${RUNNER_TEMP}/iphoneloadly-pre-modes"
          done
          docker exec "${container}" bash -c \
            'mkdir -p /run/iphoneloadly && nohup socat UNIX-LISTEN:/run/iphoneloadly/mux.sock,fork SYSTEM:"cat" </dev/null >/tmp/mux.log 2>&1 &'
          echo "Using seeded alpha.2 preservation fixture; no Apple credentials or real pairing are used."
          docker exec "${container}" bash /tmp/package/install-iphoneloadly.sh \
            --upgrade \
            --binary /tmp/package/bin/iphoneloadly-api \
            --package-root /tmp/package
          : >"${RUNNER_TEMP}/iphoneloadly-post-hashes"
          : >"${RUNNER_TEMP}/iphoneloadly-post-modes"
          for path in "${preserved_files[@]}"; do
            docker exec "${container}" sha256sum "${path}" \
              >>"${RUNNER_TEMP}/iphoneloadly-post-hashes"
            docker exec "${container}" stat --format='%a %U:%G %n' "${path}" \
              >>"${RUNNER_TEMP}/iphoneloadly-post-modes"
          done
          diff --unified=0 \
            "${RUNNER_TEMP}/iphoneloadly-pre-hashes" \
            "${RUNNER_TEMP}/iphoneloadly-post-hashes"
          diff --unified=0 \
            "${RUNNER_TEMP}/iphoneloadly-pre-modes" \
            "${RUNNER_TEMP}/iphoneloadly-post-modes"
          docker exec "${container}" test -x /opt/iphoneloadly/bin/iphoneloadly-api
          docker exec "${container}" test -x /usr/local/libexec/iphoneloadly/update-iphoneloadly.sh
          for unit in \
            iphoneloadly-api.service \
            iphoneloadly-update.service \
            iphoneloadly-update.path \
            iphoneloadly-source-sync.service \
            iphoneloadly-source-sync.timer; do
            docker exec "${container}" test -f "/etc/systemd/system/${unit}"
          done
          docker exec "${container}" bash -c \
            'curl --fail --silent http://127.0.0.1:8080/healthz | tee /tmp/healthz.json'
          docker exec "${container}" grep -Fq \
            '"version":"0.2.0-alpha.3"' /tmp/healthz.json
      - name: Upload verified Linux package
        uses: actions/upload-artifact@v4
        with:
          name: iphoneloadly-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
